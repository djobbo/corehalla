# Corehalla local Postgres.
#
# `pnpm db:start` still runs `supabase start`, but the app only uses the
# Postgres instance: the CLI is the most convenient way to run the same
# Postgres major version as the hosted project. Authentication, PostgREST,
# Realtime, Storage and the Edge runtime are disabled because the application
# owns those concerns now (`web/src/effect/Auth.ts`, Drizzle over a direct
# connection).
#
# Full reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "corehalla"

[api]
# PostgREST + Auth + Realtime gateway: unused by the app.
enabled = false

[db]
# Port to use for the local database URL (Drizzle connects here).
port = 54322
# Port used by `db diff` to initialize the shadow database.
shadow_port = 54320
# Maximum amount of time to wait for the health check when starting the database.
health_timeout = "2m"
# Keep this in step with the hosted project's Postgres major version.
major_version = 17

[db.migrations]
# Drizzle owns the schema: migrations live in `packages/db/drizzle` and are
# applied by `pnpm db:migrate`, not by the Supabase CLI.
enabled = false

[db.seed]
# Seeds are managed by Drizzle too; there is no `supabase/seed.sql`.
enabled = false

[realtime]
# Live updates are gone: the app mutates through its own API and keeps state
# locally instead of subscribing to `postgres_changes`.
enabled = false

[studio]
enabled = true
# Port for Supabase Studio.
port = 54323

[storage]
# The app stores no objects in Supabase Storage.
enabled = false

[auth]
# Supabase Auth (GoTrue) is gone; sessions are app-owned.
enabled = false

[edge_runtime]
# No edge functions are deployed from this repository.
enabled = false

[analytics]
# Logflare is not used locally.
enabled = false
